<a href="/dashboard/{{ app.id }}"
   class="block bg-white rounded-md border border-gray-200 p-3 hover:shadow-md hover:border-gray-300 transition">
    <div class="font-medium text-sm text-gray-900 mb-1">{{ app.company }}</div>
    <div class="text-xs text-gray-500 mb-2">{{ app.role }}</div>
    <div class="flex items-center justify-between">
        <span class="text-xs text-gray-400">{{ app.created_at.strftime('%b %d') if app.created_at else '' }}</span>
        {% if app.tailoring_result %}
        <span class="text-xs text-green-600 font-medium">Tailored</span>
        {% endif %}
    </div>
</a>
