<form hx-post="/dashboard"
      hx-target="#app-list"
      hx-swap="afterbegin"
      hx-on::after-request="if(event.detail.successful) { this.reset(); document.getElementById('create-form').classList.add('hidden'); }"
      class="bg-surface-raised rounded-xl border border-slate-700/50 p-6">
    <h2 class="text-lg font-semibold text-white mb-4">New Application</h2>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
            <label for="company" class="block text-sm font-medium text-slate-300 mb-1">Company *</label>
            <input type="text" name="company" id="company" required
                   class="w-full px-3 py-2 bg-surface border border-slate-600 rounded-lg text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent">
        </div>
        <div>
            <label for="role" class="block text-sm font-medium text-slate-300 mb-1">Role *</label>
            <input type="text" name="role" id="role" required
                   class="w-full px-3 py-2 bg-surface border border-slate-600 rounded-lg text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent">
        </div>
        <div class="md:col-span-2">
            <label for="url" class="block text-sm font-medium text-slate-300 mb-1">Job URL</label>
            <input type="url" name="url" id="url"
                   class="w-full px-3 py-2 bg-surface border border-slate-600 rounded-lg text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent">
        </div>
        <div class="md:col-span-2">
            <label for="jd_text" class="block text-sm font-medium text-slate-300 mb-1">Job Description *</label>
            <textarea name="jd_text" id="jd_text" rows="4" required
                      class="w-full px-3 py-2 bg-surface border border-slate-600 rounded-lg text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent"></textarea>
        </div>
        <div class="md:col-span-2">
            <label for="notes" class="block text-sm font-medium text-slate-300 mb-1">Notes</label>
            <textarea name="notes" id="notes" rows="2"
                      class="w-full px-3 py-2 bg-surface border border-slate-600 rounded-lg text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent"></textarea>
        </div>
    </div>
    <div class="flex justify-end gap-3 mt-4">
        <button type="button"
                onclick="document.getElementById('create-form').classList.add('hidden')"
                class="px-4 py-2 text-slate-300 font-medium hover:bg-slate-700 rounded-lg transition">
            Cancel
        </button>
        <button type="submit"
                class="bg-brand-600 text-white px-4 py-2 rounded-lg font-medium hover:bg-brand-500 transition">
            Save Application
        </button>
    </div>
</form>
