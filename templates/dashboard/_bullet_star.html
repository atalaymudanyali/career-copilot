<form hx-post="/dashboard/favorites/toggle"
      hx-target="this"
      hx-swap="outerHTML"
      class="inline">
    <input type="hidden" name="application_id" value="{{ app_id }}">
    <input type="hidden" name="bullet_text" value="{{ bullet.text if bullet.text is defined else bullet['text'] }}">
    <input type="hidden" name="source_id" value="{{ bullet.source_id if bullet.source_id is defined else bullet['source_id'] }}">
    <input type="hidden" name="relevance" value="{{ bullet.relevance if bullet.relevance is defined else bullet.get('relevance', 'medium') }}">
    <button type="submit"
            class="w-7 h-7 rounded-md flex items-center justify-center text-base transition
                   {% if is_favorited %}bg-amber-400/20 text-amber-400 hover:bg-amber-400/30{% else %}text-slate-600 hover:text-amber-400 hover:bg-amber-400/10{% endif %}"
            title="{{ 'Remove from favorites' if is_favorited else 'Add to favorites' }}">
        {% if is_favorited %}&#9733;{% else %}&#9734;{% endif %}
    </button>
</form>
