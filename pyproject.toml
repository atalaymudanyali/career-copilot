[project]
name = "career-copilot"
version = "0.5.0"
description = "AI-powered career copilot that tailors CV bullets to job descriptions using only real experience"
readme = "README.md"
authors = [
    { name = "Atalay Mudanyali", email = "atalay.mudanyali@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "typer>=0.15",
    "httpx>=0.28",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "rich>=13.0",
    "python-frontmatter>=1.1",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pgvector>=0.3",
    "psycopg2-binary>=2.9",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "weasyprint>=63",
    "mcp[cli]>=1.0",
]

[project.scripts]
career-copilot = "career_copilot.cli:app"
career-copilot-mcp = "career_copilot.mcp_server:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.11",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
