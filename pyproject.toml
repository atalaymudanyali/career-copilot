[project]
name = "career-copilot"
version = "0.1.0"
description = "AI-powered career copilot that tailors CV bullets to job descriptions using only real experience"
readme = "README.md"
authors = [
    { name = "Atalay Mudanyali", email = "atalay.mudanyali@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "typer>=0.15",
    "httpx>=0.28",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "rich>=13.0",
    "python-frontmatter>=1.1",
]

[project.scripts]
career-copilot = "career_copilot.cli:app"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.11",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
